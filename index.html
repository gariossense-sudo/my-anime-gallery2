<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Galeri pribadi untuk koleksi Waifu, Anime, dan Penghormatan." />
  <title>My Anime Gallery</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="hero">
    <div class="hero-overlay">
      <p class="eyebrow">MY PERSONAL GALLERY</p>
      <h1>My Anime Gallery</h1>
      <p class="subtitle">Kumpulan karakter dan kenangan favoritku.</p>
    </div>
  </header>

  <main class="container">
    <nav class="category-nav" aria-label="Kategori galeri">
      <button class="category-btn active" data-category="all">Semua</button>
      <button class="category-btn" data-category="waifu">Waifu</button>
      <button class="category-btn" data-category="anime">Anime</button>
      <button class="category-btn" data-category="penghormatan">Penghormatan</button>
    </nav>

    <section id="gallery" class="gallery" aria-live="polite"></section>

    <p id="emptyState" class="empty-state hidden">
      Belum ada foto pada kategori ini.
    </p>
  </main>

  <div id="photoModal" class="modal hidden" role="dialog" aria-modal="true" aria-label="Detail foto">
    <button id="closeModal" class="modal-close" aria-label="Tutup">&times;</button>

    <div class="modal-content">
      <img id="modalImage" src="" alt="" />
      <div class="modal-info">
        <span id="modalCategory" class="badge"></span>
        <h2 id="modalName"></h2>
        <p><strong>Umur:</strong> <span id="modalAge"></span></p>
        <p id="modalNote"></p>
      </div>
    </div>
  </div>

  <footer>
    <p>by Arga</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
